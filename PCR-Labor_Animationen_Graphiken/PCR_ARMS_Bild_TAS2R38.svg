<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI',Arial,sans-serif">
<title>Tetra-Primer-ARMS-PCR am TAS2R38-Gen: Primerlage, Syntheserichtung und die drei Produkte</title>
